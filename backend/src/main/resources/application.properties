spring.application.name=i-itsm
server.port=${PORT:8080}

# --- Persistence: H2 database stored in a file (./data/itsm-db.mv.db), survives restarts.
# Delete the data folder to start again with fresh demo data.
spring.datasource.url=jdbc:h2:file:./data/itsm-db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# --- Security (override the secret with the ITSM_JWT_SECRET environment variable in production)
itsm.jwt.secret=${ITSM_JWT_SECRET:dev-only-secret-change-me-0123456789-abcdefghijklmnop}
itsm.jwt.validity-hours=8

# --- Optional AI classifier (any OpenAI-compatible API). Leave the key empty to use the built-in model.
itsm.ai.api-key=${ITSM_AI_API_KEY:}
itsm.ai.base-url=${ITSM_AI_BASE_URL:https://api.openai.com/v1}
itsm.ai.model=${ITSM_AI_MODEL:gpt-4o-mini}

# --- Optional real e-mail (Gmail by default). Credentials come only from environment variables;
# without them e-mails are simulated. Use a Gmail App Password, never the account password.
spring.mail.host=${ITSM_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${ITSM_MAIL_PORT:587}
spring.mail.username=${ITSM_MAIL_USERNAME:}
spring.mail.password=${ITSM_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Send every notification to this one inbox instead of the real recipient (handy for demos).
itsm.mail.redirect-to=${ITSM_MAIL_REDIRECT_TO:}

# --- Background SLA monitor
itsm.sla.monitor-interval-ms=30000
itsm.sla.monitor-initial-delay-ms=15000

# --- Demo data loaded on first start
itsm.seed.enabled=true
itsm.seed.sample-incidents=true

logging.level.com.itsm=INFO
